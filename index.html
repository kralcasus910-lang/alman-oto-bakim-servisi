<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alman Oto Bakım Servisi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef2f7;color:#172033}
header{background:#102542;color:white;padding:24px 18px}
header h1{margin:0;font-size:25px}
header p{color:#cbd8e8}
main{padding:16px;max-width:650px;margin:auto}
.card{background:white;padding:18px;border-radius:14px;margin-bottom:16px;box-shadow:0 3px 12px #0000000c}
h2{font-size:19px;margin-top:0}
input,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd4df;border-radius:8px;font-size:16px}
button{background:#1264a3;color:white;border:0;border-radius:8px;padding:12px 15px;font-size:15px;cursor:pointer}
.item{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}
.total{font-size:23px;font-weight:bold;color:#1264a3}
small{color:#65748b}
</style>
</head>
<body>
<header>
<h1>Alman Oto Bakım Servisi</h1>
<p>Araç, müşteri ve servis takip sistemi</p>
</header>
<main>
<div class="card">
<h2>🚗 Araç ve Müşteri Kaydı</h2>
<input id="musteri" placeholder="Müşteri adı soyadı">
<input id="telefon" placeholder="Telefon numarası" type="tel">
<input id="plaka" placeholder="Araç plakası">
<input id="arac" placeholder="Marka ve model">
<button onclick="aracEkle()">Araç Kaydet</button>
</div>

<div class="card">
<h2>🛠️ Servis ve Ücret Hesabı</h2>
<input id="servisPlaka" placeholder="Araç plakası">
<input id="islem" placeholder="Yapılan bakım veya işlem">
<input id="parca" type="number" min="0" step="0.01" placeholder="Parça ücreti (TL)">
<input id="iscilik" type="number" min="0" step="0.01" placeholder="İşçilik ücreti (TL)">
<p>Toplam ücret: <span class="total" id="toplam">0,00 TL</span></p>
<button onclick="hesapla()">Ücreti Hesapla</button>
<button onclick="servisEkle()">Servis Kaydet</button>
</div>

<div class="card">
<h2>📋 Kayıtlı Araçlar</h2>
<div id="araclar"><small>Henüz araç kaydı yok.</small></div>
</div>

<div class="card">
<h2>🧾 Servis Geçmişi</h2>
<div id="gecmis"><small>Henüz servis kaydı yok.</small></div>
</div>
</main>
<script>
const oku=k=>JSON.parse(localStorage.getItem(k)||"[]");
const yaz=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const deger=id=>document.getElementById(id).value.trim();
const para=n=>Number(n||0).toLocaleString("tr-TR",{style:"currency",currency:"TRY"});
function hesapla(){
let p=Number(deger("parca")||0),i=Number(deger("iscilik")||0);
document.getElementById("toplam").textContent=para(p+i);
return p+i;
}
function aracEkle(){
let ad=deger("musteri"),plaka=deger("plaka"),arac=deger("arac");
if(!ad||!plaka||!arac){alert("Müşteri adı, plaka ve araç bilgilerini girin.");return}
let liste=oku("araclar");
liste.push({ad,telefon:deger("telefon"),plaka,arac});
yaz("araclar",liste);goster();alert("Araç kaydedildi.");
["musteri","telefon","plaka","arac"].forEach(id=>document.getElementById(id).value="");
}
function servisEkle(){
let plaka=deger("servisPlaka"),islem=deger("islem");
if(!plaka||!islem){alert("Plaka ve yapılan işlemi girin.");return}
let liste=oku("servisler");
liste.push({plaka,islem,parca:Number(deger("parca")||0),iscilik:Number(deger("iscilik")||0),tarih:new Date().toLocaleDateString("tr-TR")});
yaz("servisler",liste);goster();alert("Servis kaydedildi.");
}
function goster(){
let a=oku("araclar"),s=oku("servisler");
document.getElementById("araclar").innerHTML=a.length?a.map(x=>`<div class="item"><b>${guvenli(x.plaka)} — ${guvenli(x.arac)}</b><br>${guvenli(x.ad)}<br>${guvenli(x.telefon)}</div>`).join(""):"<small>Henüz araç kaydı yok.</small>";
document.getElementById("gecmis").innerHTML=s.length?s.slice().reverse().map(x=>`<div class="item"><b>${guvenli(x.plaka)}</b><br>${guvenli(x.islem)}<br>${x.tarih}<br>Parça: ${para(x.parca)}<br>İşçilik: ${para(x.iscilik)}<br><b>Toplam: ${para(x.parca+x.iscilik)}</b></div>`).join(""):"<small>Henüz servis kaydı yok.</small>";
}
function guvenli(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
goster();
</script>
</body>
</html>
